name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          pip install pyflakes
          python -m pyflakes steamroutetool.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: iptables integration tests
        run: sudo SRT_IPTABLES_TESTS=1 "$(which python)" -m unittest discover -s tests -v
